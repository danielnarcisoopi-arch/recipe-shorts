[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-shorts"
version = "1.0.0"
description = "Automated Portuguese recipe Shorts publisher"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3", "Pillow>=10.4,<13", "edge-tts>=7,<8",
  "google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1", "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
