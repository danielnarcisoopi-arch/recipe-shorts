name: Recipe Shorts · six daily editions

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Publicar este teste no YouTube (deixe desligado para só gerar o vídeo)
        required: false
        default: false
        type: boolean
  schedule:
    # Gate in Europe/Lisbon inside the app, so daylight-saving changes are automatic.
    - cron: '0 * * * *'

concurrency:
  group: recipe-shorts-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPLOAD_ENABLED: ${{ github.event_name == 'schedule' || inputs.upload }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_YOUTUBE_CHANNEL_ID: ${{ vars.EXPECTED_YOUTUBE_CHANNEL_ID }}
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_NOTIFY_SUBSCRIBERS: 'false'
      TIMEZONE: Europe/Lisbon
      PUBLISH_HOURS: 8,11,14,17,20,22
      RECIPE_COLLECTIONS: portugal,brazil
      TTS_VOICE: pt-PT-RaquelNeural
      LANGUAGE: pt-PT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install video tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Run checks
        run: python -m pytest -q
      - name: Check channel guard
        if: env.UPLOAD_ENABLED == 'true'
        run: |
          test -n "$YOUTUBE_TOKEN_JSON" || (echo 'Missing repository secret YOUTUBE_TOKEN_JSON' >&2; exit 1)
          test -n "$EXPECTED_YOUTUBE_CHANNEL_ID" || (echo 'Missing repository variable EXPECTED_YOUTUBE_CHANNEL_ID' >&2; exit 1)
      - name: Generate and publish the Short
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python -m recipe_shorts --force
          else
            python -m recipe_shorts
          fi
      - name: Persist recipe rotation and publish history
        if: always()
        run: |
          if [ -f data/recipes.sqlite3 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/recipes.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m 'chore: persist recipe library and publish rotation'
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Save preview and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-short-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
            data/render/**/*
          if-no-files-found: ignore
          retention-days: 14
